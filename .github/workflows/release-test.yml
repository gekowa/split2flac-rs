name: Build, verify and release
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch immutable reference image
        run: docker pull --platform linux/amd64 mikenye/split2flac@sha256:47e6cb8d835a05f08efae20f7bf196552754df09e9dc957cc473b870f4dbc8ba
      - name: Rebuild the synthetic oracle (read-only comparison)
        run: python3 tests/oracle/generate.py --check

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip
          - runner: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      PYTHONUTF8: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Set up native Windows C build tools (build time only)
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          cache: false
          install: make tar diffutils gawk grep sed patch xz gzip bzip2 mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Set up Darwin C build tools (build time only)
        if: runner.os == 'macOS'
        run: command -v pkg-config || brew install pkgconf
      - name: Fetch locked build inputs
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          rustup component add rust-docs
          cargo fetch --locked --target "$TARGET"
          python packaging/package.py --target "$TARGET" --fetch-only
      - name: Compile with MSVC before exposing the separate MinGW build environment
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --offline --release --target "$TARGET"
      - name: Assemble offline package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
          MSYSTEM: UCRT64
        run: |
          $python = (Get-Command python.exe).Source
          $env:PATH = "$env:MSYS_ROOT\ucrt64\bin;$env:MSYS_ROOT\usr\bin;$env:PATH"
          & $python packaging/package.py --target $env:TARGET --bin "target/$env:TARGET/release/split2flac-rs.exe" --bash "$env:MSYS_ROOT\usr\bin\bash.exe" --offline
      - name: Assemble offline package (macOS)
        if: runner.os == 'macOS'
        run: python packaging/package.py --target "$TARGET" --offline
      - name: Verify the unpacked release and run Rust tests with its codecs
        shell: bash
        run: |
          set -euo pipefail
          # Record the host, checksum and completed cases even on failure.
          trap 'cat "$RUNNER_TEMP/acceptance.txt" >> "$GITHUB_STEP_SUMMARY"' EXIT
          python packaging/check_release.py "dist/split2flac-rs-$TARGET.${{ matrix.ext }}" --target "$TARGET" --cargo-test 2>&1 | tee "$RUNNER_TEMP/acceptance.txt"
      - name: Stage the verified release files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/split2flac-rs-${{ matrix.target }}.${{ matrix.ext }}
            dist/split2flac-rs-${{ matrix.target }}.${{ matrix.ext }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [reference, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums to GitHub Releases
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict *.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes *.zip *.tar.gz *.sha256
