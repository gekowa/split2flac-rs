[package]
name = "split2flac"
version = "0.1.0"
edition = "2024"
description = "Sample-accurate CUE image splitter compatible with split2flac v122"
license = "MIT"

[dependencies]
anyhow = "1"
chardetng = "0.1"
encoding_rs = "0.8"
glob = "0.3"
mp3rgain = "=3.16.2"
same-file = "1"
ogg = "0.9"
vorbis_rs = { version = "=0.5.6", default-features = false }
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
